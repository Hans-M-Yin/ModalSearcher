# Qwen3-VL-8B full SFT on SearchWeave, FVQA, and LiveVQA (4 epochs).
# USE_RAY=1 python -m llamafactory.cli train examples/agentic_full/qwen3_vl_full_sft_8b_ray_2node16gpu_searchweave_fvqa_livevqa_16004_epoch4.yaml
### model
model_name_or_path: ../models/qwen3-vl-8b
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true
flash_attn: fa2

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: false
freeze_multi_modal_projector: false
deepspeed: examples/deepspeed/ds_z3_searchweave_low_memory_config.json

### dataset
dataset: opensearch_vl_sft
dataset_dir: ../data/searchweave_fqva_livevqa_merged_16004_reference
template: qwen3_vl_nothink
cutoff_len: 32768
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4
# Role-merged cache, with 8 verified cutoff/image-token mismatches removed (15996 rows).
tokenized_path: ../data/tokenized_searchweave_fvqa_livevqa_rolemerged_v2_alignment_clean
data_shared_file_system: true

### output
output_dir: saves/qwen3_vl_8b/full/searchweave_fvqa_livevqa_16004_2node16gpu_lr_2e_5_cosine_to_zero_epoch4
logging_steps: 1
# Fraction of total optimizer steps: 1/2 of 4 epochs = every 2 epochs.
# If num_train_epochs changes, update this fraction accordingly.
save_strategy: steps
save_steps: 0.5
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb
project: mmdeepsearch
run_name: 0920_8b_2node_16gpus_searchweave_fvqa_livevqa_16004_lr_2e_5_cosine_to_zero_epoch4

### ray
ray_num_workers: 16
ray_init_kwargs:
  runtime_env:
    env_vars:
      NCCL_IB_DISABLE: "0"
      NCCL_IB_GID_INDEX: "3"
      NCCL_IB_SL: "3"
      NCCL_DEBUG: "INFO"
      NCCL_SOCKET_IFNAME: "bond1"
      GLOO_SOCKET_IFNAME: "bond1"
      TP_SOCKET_IFNAME: "bond1"
      UCX_NET_DEVICES: "bond1"
      NCCL_IB_HCA: "mlx5_bond*"
      NCCL_NET_GDR_LEVEL: "1"
      NCCL_IB_TC: "106"
      NCCL_IB_QPS_PER_CONNECTION: "4"
      NCCL_LL_THRESHOLD: "32768"
      NCCL_P2P_DISABLE: "0"
      NCCL_CHECK_DISABLE: "1"
      NCCL_PXN_DISABLE: "0"
      NCCL_COLLNET_ENABLE: "0"
      SHARP_COLL_ENABLE_SAT: "0"
      TOKENIZERS_PARALLELISM: "false"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: "python"
      WANDB_PROJECT: "mmdeepsearch"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: true
learning_rate: 2.0e-5
num_train_epochs: 4.0
lr_scheduler_type: cosine
# HF cosine scheduler reaches zero at the end when num_cycles=0.5.
lr_scheduler_kwargs:
  num_cycles: 0.5
warmup_ratio: 0.1
bf16: true
ddp_timeout: 1800
resume_from_checkpoint: false

